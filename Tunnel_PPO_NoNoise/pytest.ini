[pytest]
# `0_envs/__init__.py` makes pytest's default "prepend" import mode walk up
# the directory tree building a dotted package name for every test file,
# and it trips on the leading digit in `0_envs` (it ends up trying to exec
# `0_envs/__init__.py` under the bogus module name "__init__" with no
# parent package, which fails on that file's relative imports). The
# `importlib` import mode loads each test/conftest file as its own
# uniquely-named module instead of walking that package chain, which
# sidesteps the problem entirely. Verified: 0_envs/tests fails collection
# under the default mode and passes under this one.
addopts = --import-mode=importlib
