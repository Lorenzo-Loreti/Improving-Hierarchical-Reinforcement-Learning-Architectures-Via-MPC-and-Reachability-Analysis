# Tuning configuration c6 of ppo_mpc (decision log D65): configs/agent/ppo_mpc.yaml with
# manager.update.learning_rate = 0.001, manager.update.entropy_coef = 0.01 and mpc.effort_weight = 1;
# nothing else differs (a test). The eight files cover the 2 x 2 x 2 design of D65; c1 is the pre-tuning file.
# Run on configs/env/slalom_sparse.yaml with --seeds 101 102 103 --runs-dir runs/tuning/ppo_mpc.
hierarchy:
  segment_steps: 10
  target_reach_factor: 1.5
  worker_progress_coef: 10.0
rollout:
  num_envs: 8
  num_steps: 256
manager:
  network:
    hidden_sizes:
    - 64
    - 64
  update:
    discount: 0.99
    epochs: 10
    minibatches: 4
    learning_rate: 0.001
    anneal_learning_rate: false
    critic_lr_mult: 3.0
    adam_eps: 1.0e-05
    gae_lambda: 0.95
    clip_coef: 0.2
    entropy_coef: 0.01
    max_grad_norm: 0.5
    value_norm_horizon: 10
mpc:
  horizon: null
  q_pos: 10.0
  q_vel: 1.0
  r: 0.1
  target_weight: 10000.0
  effort_weight: 1.0
  start_weight: 0.1
  rho: 0.001
  tail_tolerance: 0.001
  mip_gap: 0.0001
  work_limit: null
reachability: null
evaluation:
  every: 10240
  grid:
  - 5
  - 5
  seed: 12345
runtime:
  device: cpu
  torch_threads: 1
