# Tuning configuration c8 of ppo (decision log D65): configs/agent/ppo.yaml with
# update.learning_rate = 0.001, update.entropy_coef = 0.03 and rollout.num_steps = 256;
# nothing else differs (a test). The eight files cover the 2 x 2 x 2 design of D65; c1 is the pre-tuning file.
# Run on configs/env/slalom_sparse.yaml with --seeds 101 102 103 --runs-dir runs/tuning/ppo.
network:
  hidden_sizes:
  - 64
  - 64
rollout:
  num_envs: 8
  num_steps: 256
update:
  discount: 0.99
  epochs: 10
  minibatches: 4
  learning_rate: 0.001
  anneal_learning_rate: true
  critic_lr_mult: 3.0
  adam_eps: 1.0e-05
  gae_lambda: 0.95
  clip_coef: 0.2
  entropy_coef: 0.03
  max_grad_norm: 0.5
  value_norm_horizon: 10
evaluation:
  every: 10240
  grid:
  - 5
  - 5
  seed: 12345
runtime:
  device: cpu
  torch_threads: 1
