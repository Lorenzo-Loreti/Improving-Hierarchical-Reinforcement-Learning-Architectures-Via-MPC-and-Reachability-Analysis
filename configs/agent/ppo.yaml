# Flat PPO (decision log D5, D19): a faithful port of the pre-alignment
# implementation, with its tuning (algorithms/ppo/ppo_train.py at tag
# pre-alignment). The values are provisional until the tuning protocol (Q13).
# Write floats with a dot and a signed exponent (3.0e-4, 1.0e+5): YAML 1.1 reads 3e-4 and 1.0e5 as strings.

network:
  hidden_sizes: [64, 64]       # separate tanh MLPs for the actor and the critic

rollout:
  num_envs: 8                  # parallel agents of NavigationEnv
  num_steps: 128               # steps per agent and update: 1 024 samples per update

update:
  discount: 0.99               # gamma_RL (D13); independent of the environment's shaping_discount (D22)
  epochs: 10
  minibatches: 4               # 256 samples per minibatch
  learning_rate: 3.0e-4        # actor
  anneal_learning_rate: true   # linear decay to 0 over the budget
  critic_lr_mult: 3.0          # critic learning rate = 3 x learning_rate
  adam_eps: 1.0e-5
  gae_lambda: 0.95
  clip_coef: 0.2
  entropy_coef: 0.01
  max_grad_norm: 0.5           # per network
  value_norm_horizon: 10       # updates in the running statistics of the critic's targets

evaluation:                    # decision log D20
  every: 10240                 # samples between evaluations (10 updates); the first is at 0
  grid: [5, 5]                 # starts on the spawn box, at rest
  seed: 12345                  # evaluation environment: the same for every run, distinct from the training seeds

runtime:
  device: cpu
  torch_threads: 1
