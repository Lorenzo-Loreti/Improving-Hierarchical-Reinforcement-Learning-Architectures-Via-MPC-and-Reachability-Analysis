# Narrow slalom (decision log D61): the slalom with gates 0.75 m wide instead of 1.5 m,
# the same centres (y = 1 and y = -1), the sparse reward of D51 and the curriculum of D62:
# configs/env/slalom_sparse.yaml with only the obstacles changed (a test). The tube's margin at
# d_bar = 1.0 is 0.131 m per side (D31), so the planned corridor through a gate is 0.49 m wide there.
# Values from the thesis decision log: D9 (physics), D11 and D61 (geometry), D13 (task and reward),
# D14 (contact penalty), D45 (levels), D51 (sparse reward) and D62 (curriculum).

physics:
  dt: 0.1          # sampling time T_s [s]
  a_max: 2.5       # radius of the input set U [m/s^2]
  v_max: 1.2       # radius of the velocity set V [m/s]
  gamma: 0.5       # viscous friction [1/s]
  gamma_w: 1.0     # wall friction on the sliding velocity [1/s]
  d_bar: 0.0       # radius of the disturbance set D [m/s^2]; levels used: 0, 0.5, 1.0

geometry:
  arena: {x: [-1.0, 11.0], y: [-2.0, 2.0]}
  obstacles:                              # every face is a wall; gates 0.75 m wide instead of 1.5 m (D61)
    - {x: [4.0, 5.0], y: [-2.0, 0.625]}   # gate 1, lower block: opening y in [0.625, 1.375], centred at y = 1
    - {x: [4.0, 5.0], y: [1.375, 2.0]}    # gate 1, upper block
    - {x: [7.0, 8.0], y: [-2.0, -1.375]}  # gate 2, lower block: opening y in [-1.375, -0.625], centred at y = -1
    - {x: [7.0, 8.0], y: [-0.625, 2.0]}   # gate 2, upper block
  goal_x: 10.0     # goal region: p_x >= goal_x

task:
  spawn: {x: [0.0, 2.0], y: [-1.0, 1.0]}  # initial position uniform on this box, at rest (the evaluation's starts)
  horizon: 200     # truncation after this many steps
  curriculum:      # reverse spawn curriculum of the training starts (D62); absent in the shaped files
    x_start: 8.0   # the first band is [8, 10] x [-1, 1], the shape of the spawn box; the last band is the spawn box
    step: 1.0      # the band slides back by 1 m per stage: nine stages
    window: 50     # episodes started in the stage over which the success rate is measured
    threshold: 0.8 # success rate that advances the stage

reward:            # all coefficients non-negative; signs in hrlmpc.config.RewardConfig
  time_penalty: 1.0
  success_bonus: 1000.0
  progress_coef: 0.0           # sparse reward (D51): no progress term; 10.0 in the shaped files
  shaping_discount: 1.0        # no effect with progress_coef 0; kept as in the shaped files (D22)
  effort_coef: 0.01            # times ||u||^2 / a_max^2
  contact_impulse_coef: 50.0   # c_n [s/m], times the wall's velocity correction
  contact_step_coef: 1.0       # c_s, per step in contact
