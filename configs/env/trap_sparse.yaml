# Trap layout with the sparse reward of decision log D51 (D69): the complex case of
# the comparison. A U-shaped obstacle opening towards the spawn box sits on the
# straight route to the goal (its cavity is a dead end 1.5 m deep and 1.6 m wide,
# with corridors of 0.8 m around it), and a gate of 0.75 m follows it. Physics,
# arena, spawn box, goal, reward and curriculum as in slalom_sparse.yaml; the
# curriculum's bands span the arena's height (task.curriculum.y), so that the corridors
# around the U carry training starts, and the cavity carries them like any other free
# region (no task.curriculum.exclude), so that every stage extends the one before: the
# cavity is learned before the starts in front of the mouth, which lead into it.
# Values from the decision log: D9 (physics), D13 (task and reward), D14 (contact
# penalty), D51 (sparse reward), D62 (curriculum), D69 (amended 2026-10-15 and -16).

physics:
  dt: 0.1          # sampling time T_s [s]
  a_max: 2.5       # radius of the input set U [m/s^2]
  v_max: 1.2       # radius of the velocity set V [m/s]
  gamma: 0.5       # viscous friction [1/s]
  gamma_w: 1.0     # wall friction on the sliding velocity [1/s]
  d_bar: 0.0       # radius of the disturbance set D [m/s^2]; levels used: 0, 0.5, 1.0

geometry:
  arena: {x: [-1.0, 11.0], y: [-2.0, 2.0]}
  obstacles:                              # every face is a wall
    - {x: [5.25, 5.75], y: [-1.2, 1.2]}   # the U: back wall
    - {x: [3.75, 5.75], y: [0.8, 1.2]}    # the U: upper arm (corridor of 0.8 m above it)
    - {x: [3.75, 5.75], y: [-1.2, -0.8]}  # the U: lower arm (corridor of 0.8 m below it)
    - {x: [8.0, 8.5], y: [-2.0, -0.375]}  # the gate, lower block
    - {x: [8.0, 8.5], y: [0.375, 2.0]}    # the gate, upper block: a gate of 0.75 m centred on y = 0
  goal_x: 10.0     # goal region: p_x >= goal_x

task:
  spawn: {x: [0.0, 2.0], y: [-1.0, 1.0]}  # initial position uniform on this box, at rest (the evaluation's starts)
  horizon: 200     # truncation after this many steps
  curriculum:      # reverse spawn curriculum of the training starts (D62)
    x_start: 8.0   # the first band is [8, 10] x [-2, 2] (the height below); the last band is the spawn box
    step: 1.0      # the band slides back by 1 m per stage: nine stages
    window: 50     # episodes started in the stage over which the success rate is measured
    threshold: 0.8 # success rate that advances the stage
    y: [-2.0, 2.0] # the bands span the arena's height: the corridors around the U carry starts (D69)

reward:            # all coefficients non-negative; signs in hrlmpc.config.RewardConfig
  time_penalty: 1.0
  success_bonus: 1000.0
  progress_coef: 0.0           # sparse reward (D51): no progress term; 10.0 in the shaped files
  shaping_discount: 1.0        # no effect with progress_coef 0; kept as in the shaped files (D22)
  effort_coef: 0.01            # times ||u||^2 / a_max^2
  contact_impulse_coef: 50.0   # c_n [s/m], times the wall's velocity correction
  contact_step_coef: 1.0       # c_s, per step in contact
