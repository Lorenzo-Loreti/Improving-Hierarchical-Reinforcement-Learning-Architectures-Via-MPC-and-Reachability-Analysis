[pytest]
# Several directories reuse the same test filename (test_ppo_mpc.py under
# both algorithms/ppo_mpc/tests and algorithms/ppo_mpc_reach/tests;
# test_vec_rollout.py under three algorithm test dirs; conftest.py
# everywhere) and none of the test dirs have __init__.py. Under the default
# "prepend" import mode, pytest derives each module's import name from its
# bare filename when there's no package chain, so same-named files in
# different directories collide ("import file mismatch"). The "importlib"
# mode loads each test/conftest file as its own uniquely-named module
# instead, sidestepping the problem entirely.
addopts = --import-mode=importlib
