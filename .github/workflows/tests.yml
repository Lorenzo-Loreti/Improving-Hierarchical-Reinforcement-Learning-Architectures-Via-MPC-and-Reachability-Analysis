   name: tests

   on:
     push:
       branches: [main]
     pull_request:

   jobs:
     hrlmpc:
       name: hrlmpc package (tests/)
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: Install PyTorch (CPU wheel)
           run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
         - name: Install the package and the test tools
           run: python -m pip install -e ".[rl,plots,test]"
         - name: Run the tests of the new package
           run: python -m pytest tests -q